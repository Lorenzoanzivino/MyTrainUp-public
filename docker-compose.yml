services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=demo_secret_key_123
      - DB_NAME=fitplanner.db
      - DEBUG=True

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:5000/api
    ports:
      - "3000:80"
    depends_on:
      - backend
